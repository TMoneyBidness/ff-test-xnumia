<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xnumia — Payment Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #253349;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --border: #334155;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;
    --gray: #6b7280;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Header ─────────────────────────────────── */
  .header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .header h1 span {
    color: var(--blue);
  }

  .stats-bar {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-top: 0.2rem;
  }

  .refresh-toggle {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    user-select: none;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .refresh-toggle input { display: none; }

  .toggle-track {
    width: 40px;
    height: 22px;
    background: var(--border);
    border-radius: 11px;
    position: relative;
    transition: background 0.2s;
  }

  .toggle-track::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    background: var(--text-muted);
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }

  .refresh-toggle input:checked + .toggle-track {
    background: var(--green);
  }

  .refresh-toggle input:checked + .toggle-track::after {
    transform: translateX(18px);
    background: white;
  }

  /* ── Layout ─────────────────────────────────── */
  .layout {
    max-width: 1440px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 1.5rem;
    padding: 1.5rem 2rem;
    min-height: calc(100vh - 80px);
  }

  /* ── Pipeline cards ─────────────────────────── */
  .pipeline-section h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 1rem;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .card:hover {
    border-color: #475569;
  }

  .card.escalated {
    animation: pulse-border 2s ease-in-out infinite;
  }

  @keyframes pulse-border {
    0%, 100% { border-color: var(--amber); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    50% { border-color: var(--amber); box-shadow: 0 0 12px 0 rgba(245, 158, 11, 0.15); }
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .card-client {
    font-weight: 600;
    font-size: 1rem;
  }

  .card-amount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    color: var(--text);
  }

  .card-currencies {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.15rem;
  }

  .card-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--gray);
    margin-top: 0.25rem;
  }

  .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.25rem 0.65rem;
    border-radius: 6px;
    white-space: nowrap;
  }

  .badge-APPROVED { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge-ESCALATED { background: rgba(245,158,11,0.15); color: var(--amber); }
  .badge-REJECTED { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge-PROCESSING { background: rgba(59,130,246,0.15); color: var(--blue); }
  .badge-PENDING { background: rgba(107,114,128,0.15); color: var(--gray); }

  /* ── Agent pipeline viz ─────────────────────── */
  .pipeline-viz {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .agent-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    cursor: pointer;
  }

  .agent-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 600;
    color: white;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }

  .agent-circle:hover {
    transform: scale(1.15);
  }

  .agent-circle.active {
    transform: scale(1.15);
    outline: 2px solid white;
    outline-offset: 2px;
  }

  .agent-circle.green  { background: var(--green); box-shadow: 0 0 12px rgba(34,197,94,0.4); }
  .agent-circle.amber  { background: var(--amber); box-shadow: 0 0 12px rgba(245,158,11,0.4); }
  .agent-circle.red    { background: var(--red);   box-shadow: 0 0 12px rgba(239,68,68,0.4); }
  .agent-circle.gray   { background: var(--gray);  box-shadow: none; }

  .agent-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  .agent-connector {
    width: 24px;
    height: 2px;
    background: var(--border);
    margin-bottom: 1.2rem;
  }

  /* ── Agent detail panel ─────────────────────── */
  .agent-detail {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
    margin-top: 0;
  }

  .agent-detail.open {
    max-height: 300px;
    opacity: 1;
    margin-top: 1rem;
  }

  .agent-detail-inner {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }

  .agent-detail-header {
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .agent-detail-field {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.35rem;
  }

  .agent-detail-field strong {
    color: var(--text);
  }

  /* ── Sidebar ────────────────────────────────── */
  .sidebar {
    position: sticky;
    top: 100px;
    align-self: start;
  }

  .sidebar h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .sidebar h2 .count {
    background: var(--amber);
    color: #0f172a;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.1rem 0.5rem;
    border-radius: 10px;
  }

  .queue-cards {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .queue-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
  }

  .queue-client {
    font-weight: 600;
    font-size: 0.9rem;
  }

  .queue-amount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    margin-top: 0.2rem;
  }

  .queue-reason {
    font-size: 0.75rem;
    color: var(--amber);
    margin-top: 0.4rem;
    padding: 0.4rem 0.6rem;
    background: rgba(245,158,11,0.08);
    border-radius: 6px;
  }

  .queue-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .queue-actions button {
    flex: 1;
    padding: 0.5rem;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    transition: opacity 0.15s;
    font-family: inherit;
  }

  .queue-actions button:hover { opacity: 0.85; }

  .btn-approve { background: var(--green); color: white; }
  .btn-reject  { background: var(--red); color: white; }

  .reject-input {
    display: none;
    margin-top: 0.5rem;
  }

  .reject-input.show {
    display: flex;
    gap: 0.5rem;
  }

  .reject-input input {
    flex: 1;
    padding: 0.4rem 0.6rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.8rem;
    font-family: inherit;
    outline: none;
  }

  .reject-input input:focus { border-color: var(--blue); }

  .reject-input button {
    padding: 0.4rem 0.75rem;
    background: var(--red);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 2rem 1rem;
  }

  /* ── Responsive ─────────────────────────────── */
  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
      padding: 1rem;
    }
    .sidebar {
      position: static;
    }
    .header-inner {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <h1><span>Xnumia</span> — Payment Pipeline</h1>
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-value" style="color:var(--green)" id="stat-approved">—</div>
        <div class="stat-label">Approved</div>
      </div>
      <div class="stat">
        <div class="stat-value" style="color:var(--amber)" id="stat-escalated">—</div>
        <div class="stat-label">Escalated</div>
      </div>
      <div class="stat">
        <div class="stat-value" style="color:var(--red)" id="stat-rejected">—</div>
        <div class="stat-label">Rejected</div>
      </div>
    </div>
    <label class="refresh-toggle">
      <input type="checkbox" id="auto-refresh" checked>
      <div class="toggle-track"></div>
      Auto-refresh
    </label>
  </div>
</header>

<main class="layout">
  <section class="pipeline-section">
    <h2>Pipeline Requests</h2>
    <div class="cards" id="cards-container">
      <div class="empty-state">Loading...</div>
    </div>
  </section>

  <aside class="sidebar">
    <h2>Approval Queue <span class="count" id="queue-count">0</span></h2>
    <div class="queue-cards" id="queue-container">
      <div class="empty-state">No escalated requests</div>
    </div>
  </aside>
</main>

<script>
(function() {
  const AGENTS = ['intake', 'compliance', 'fx', 'risk', 'recon'];
  const AGENT_LABELS = { intake: 'Intake', compliance: 'Compliance', fx: 'FX', risk: 'Risk', recon: 'Recon' };
  const AGENT_ICONS = { intake: 'IN', compliance: 'CO', fx: 'FX', risk: 'RK', recon: 'RC' };

  let decisionsCache = {};
  let expandedAgents = {}; // { requestId: agentType }
  let refreshInterval = null;

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function formatAmount(cents, currency) {
    const dollars = (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const symbols = { USD: '$', CAD: 'C$', EUR: '\u20AC', GBP: '\u00A3', JPY: '\u00A5', CHF: 'CHF ' };
    const sym = symbols[currency] || '';
    return esc(sym + dollars + ' ' + currency);
  }

  async function fetchJSON(url, opts) {
    const res = await fetch(url, opts);
    return res.json();
  }

  async function loadStats() {
    try {
      const s = await fetchJSON('/api/stats');
      document.getElementById('stat-total').textContent = s.total ?? 0;
      document.getElementById('stat-approved').textContent = s.approved ?? 0;
      document.getElementById('stat-escalated').textContent = s.escalated ?? 0;
      document.getElementById('stat-rejected').textContent = s.rejected ?? 0;
    } catch(e) { console.error('Stats error', e); }
  }

  async function loadDecisions(requestId) {
    if (decisionsCache[requestId]) return decisionsCache[requestId];
    try {
      const data = await fetchJSON('/api/requests/' + encodeURIComponent(requestId) + '/decisions');
      const map = {};
      (data.decisions || data || []).forEach(function(d) { map[d.agent_type] = d; });
      decisionsCache[requestId] = map;
      return map;
    } catch(e) {
      console.error('Decisions error', e);
      return {};
    }
  }

  function verdictToBadgeClass(verdict) {
    if (verdict === 'green') return 'APPROVED';
    if (verdict === 'red') return 'REJECTED';
    return 'ESCALATED';
  }

  function buildAgentDetailHTML(decision) {
    if (!decision) return '';
    var detail;
    try {
      detail = typeof decision.detail === 'string' ? JSON.parse(decision.detail || '{}') : (decision.detail || {});
    } catch(e) { detail = {}; }
    var detailStr = Object.keys(detail).map(function(k) {
      return '<div class="agent-detail-field"><strong>' + esc(k) + ':</strong> ' + esc(String(detail[k])) + '</div>';
    }).join('');
    return '<div class="agent-detail-inner">' +
      '<div class="agent-detail-header"><span class="badge badge-' + verdictToBadgeClass(decision.verdict) +
      '">' + esc(decision.verdict.toUpperCase()) + '</span> ' + esc(AGENT_LABELS[decision.agent_type]) + ' Agent</div>' +
      '<div class="agent-detail-field"><strong>Action:</strong> ' + esc(decision.action || '\u2014') + '</div>' +
      '<div class="agent-detail-field"><strong>Reasoning:</strong> ' + esc(decision.reasoning || '\u2014') + '</div>' +
      (decision.duration_ms ? '<div class="agent-detail-field"><strong>Duration:</strong> ' + esc(String(decision.duration_ms)) + 'ms</div>' : '') +
      detailStr +
      '</div>';
  }

  async function renderCards(requests) {
    var container = document.getElementById('cards-container');
    if (!requests || requests.length === 0) {
      container.textContent = '';
      var empt = document.createElement('div');
      empt.className = 'empty-state';
      empt.textContent = 'No payment requests yet';
      container.appendChild(empt);
      return;
    }

    await Promise.all(requests.map(function(r) { return loadDecisions(r.id); }));

    // Build DOM using safe methods where possible, innerHTML only with escaped content
    var html = requests.map(function(r) {
      var decisions = decisionsCache[r.id] || {};
      var isEscalated = r.status === 'ESCALATED';
      var expandedAgent = expandedAgents[r.id];

      var pipelineHtml = AGENTS.map(function(agent, i) {
        var d = decisions[agent];
        var verdict = d ? d.verdict : 'gray';
        var isActive = expandedAgent === agent;
        var node = '<div class="agent-node" data-request="' + esc(r.id) + '" data-agent="' + esc(agent) + '">' +
          '<div class="agent-circle ' + esc(verdict) + (isActive ? ' active' : '') + '">' + esc(AGENT_ICONS[agent]) + '</div>' +
          '<div class="agent-label">' + esc(AGENT_LABELS[agent]) + '</div>' +
          '</div>';
        var connector = i < AGENTS.length - 1 ? '<div class="agent-connector"></div>' : '';
        return node + connector;
      }).join('');

      var detailHtml = '';
      if (expandedAgent && decisions[expandedAgent]) {
        detailHtml = '<div class="agent-detail open">' + buildAgentDetailHTML(decisions[expandedAgent]) + '</div>';
      } else if (expandedAgent) {
        detailHtml = '<div class="agent-detail open"><div class="agent-detail-inner"><div class="agent-detail-field">Agent has not run yet</div></div></div>';
      }

      return '<div class="card' + (isEscalated ? ' escalated' : '') + '">' +
        '<div class="card-top">' +
          '<div>' +
            '<div class="card-client">' + esc(r.client_name || r.client_id) + '</div>' +
            '<div class="card-amount">' + formatAmount(r.amount_cents, r.currency_from) + '</div>' +
            '<div class="card-currencies">' + esc(r.currency_from) + ' \u2192 ' + esc(r.currency_to) + '</div>' +
            '<div class="card-id">' + esc(r.id.slice(0, 8)) + '...</div>' +
          '</div>' +
          '<span class="badge badge-' + esc(r.status) + '">' + esc(r.status) + '</span>' +
        '</div>' +
        '<div class="pipeline-viz">' + pipelineHtml + '</div>' +
        detailHtml +
        '</div>';
    }).join('');

    container.innerHTML = html;

    container.querySelectorAll('.agent-node').forEach(function(node) {
      node.addEventListener('click', function() {
        var reqId = node.dataset.request;
        var agent = node.dataset.agent;
        if (expandedAgents[reqId] === agent) {
          delete expandedAgents[reqId];
        } else {
          expandedAgents[reqId] = agent;
        }
        renderCards(requests);
      });
    });
  }

  function renderQueue(requests) {
    var escalated = (requests || []).filter(function(r) { return r.status === 'ESCALATED'; });
    document.getElementById('queue-count').textContent = escalated.length;
    var container = document.getElementById('queue-container');

    if (escalated.length === 0) {
      container.textContent = '';
      var empt = document.createElement('div');
      empt.className = 'empty-state';
      empt.textContent = 'No escalated requests';
      container.appendChild(empt);
      return;
    }

    container.innerHTML = escalated.map(function(r) {
      return '<div class="queue-card">' +
        '<div class="queue-client">' + esc(r.client_name || r.client_id) + '</div>' +
        '<div class="queue-amount">' + formatAmount(r.amount_cents, r.currency_from) + '</div>' +
        (r.escalation_reason ? '<div class="queue-reason">' + esc(r.escalation_reason) + '</div>' : '') +
        '<div class="queue-actions">' +
          '<button class="btn-approve" data-id="' + esc(r.id) + '">Approve</button>' +
          '<button class="btn-reject" data-id="' + esc(r.id) + '">Reject</button>' +
        '</div>' +
        '<div class="reject-input" id="reject-' + esc(r.id) + '">' +
          '<input type="text" placeholder="Rejection reason...">' +
          '<button data-id="' + esc(r.id) + '">Send</button>' +
        '</div>' +
        '</div>';
    }).join('');

    container.querySelectorAll('.btn-approve').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        await fetchJSON('/api/requests/' + encodeURIComponent(btn.dataset.id) + '/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ approvedBy: 'dashboard-user' })
        });
        refresh();
      });
    });

    container.querySelectorAll('.btn-reject').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var el = document.getElementById('reject-' + btn.dataset.id);
        el.classList.toggle('show');
      });
    });

    container.querySelectorAll('.reject-input button').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        var input = btn.previousElementSibling;
        var reason = input.value || 'Rejected by reviewer';
        await fetchJSON('/api/requests/' + encodeURIComponent(btn.dataset.id) + '/reject', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rejectedBy: 'dashboard-user', reason: reason })
        });
        refresh();
      });
    });
  }

  var lastRequests = [];

  async function refresh() {
    try {
      var data = await fetchJSON('/api/requests');
      lastRequests = data.requests || data || [];
      decisionsCache = {};
      await renderCards(lastRequests);
      renderQueue(lastRequests);
      loadStats();
    } catch(e) {
      console.error('Refresh error', e);
    }
  }

  function startAutoRefresh() {
    stopAutoRefresh();
    refreshInterval = setInterval(refresh, 5000);
  }

  function stopAutoRefresh() {
    if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
  }

  document.getElementById('auto-refresh').addEventListener('change', function() {
    if (this.checked) startAutoRefresh(); else stopAutoRefresh();
  });

  refresh();
  startAutoRefresh();
})();
</script>
</body>
</html>
